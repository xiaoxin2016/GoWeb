<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · {{.Title}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-center">
<div class="card login-card">
  <h1 class="card-title">{{.Title}}</h1>
  <p class="card-sub">使用邮箱验证码登录</p>

  <div class="field">
    <label for="email">邮箱地址</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autofocus>
  </div>

  <div class="field code-field hidden" id="code-row">
    <label for="code">验证码</label>
    <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code">
  </div>

  <div class="login-actions">
    <button class="btn btn-primary btn-block" id="btn-send">发送验证码</button>
    <button class="btn btn-primary btn-block hidden" id="btn-verify">登 录</button>
  </div>
  <p class="login-msg" id="login-msg"></p>
  <p class="resend-row hidden" id="resend-row">
    没有收到邮件？<button type="button" class="link-btn" id="btn-resend" disabled>重新发送（60s）</button>
  </p>
</div>

<div class="toast hidden" id="toast"></div>
<script src="/static/login.js"></script>
</body>
</html>
